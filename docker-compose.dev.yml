# Локальная инфраструктура для разработки Open Music.
# Поднимает: PostgreSQL 16 + pgvector, Redis 7, MinIO (S3-совместимое объектное хранилище).
#
# Запуск: pnpm infra:up (или: docker compose -f docker-compose.dev.yml up -d)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: open-music-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: open_music
      POSTGRES_PASSWORD: open_music_dev
      POSTGRES_DB: open_music
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U open_music -d open_music']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: open-music-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: open-music-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: open_music
      MINIO_ROOT_PASSWORD: open_music_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 6

  mock-kms:
    build:
      context: ./infra/mock-kms
      dockerfile: Dockerfile
    container_name: open-music-mock-kms
    restart: unless-stopped
    ports:
      - '2599:2599'
    environment:
      PORT: 2599
      MASTER_KEY: 'dev-master-key-32-bytes-padding!!'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2599/healthz']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  redis-data:
  minio-data:
